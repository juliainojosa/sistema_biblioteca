<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Biblioteca</title>
</head>

<body>

<h1>Sistema da Biblioteca</h1>

<h2>Login do Balconista</h2>

<form method="POST">

    <label>Usuário:</label>
    <input type="text" name="usuario" required>

    <br><br>

    <label>Senha:</label>
    <input type="password" name="senha" required>

    <br><br>

    <button type="submit">Entrar</button>

</form>

</body>
</html>
